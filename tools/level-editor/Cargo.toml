[package]
name = "level-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "level_editor"
path = "src/lib.rs"

[[bin]]
name = "level-editor"
path = "src/main.rs"

[dependencies]
seihai = { path = "../../client" }
# The window (`level-editor gui`). The same versions as the client, so
# nothing new is built.
eframe = "0.29"
egui = "0.29"
