[package]
name = "level-editor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "level_editor"
path = "src/lib.rs"

[[bin]]
name = "level-editor"
path = "src/main.rs"

[dependencies]
# No sound in the editor: core without its `audio` feature.
seihai-core = { path = "../../crates/seihai-core", default-features = false, features = ["dev"] }
# The tile renderer (`seihai::render`) belongs to the client, not the core.
seihai = { package = "seihai-mae", path = "../../crates/seihai-mae", default-features = false, features = ["dev"] }
# The window (`level-editor gui`). The same versions as the client, so
# nothing new is built.
eframe = "0.29"
egui = "0.29"
