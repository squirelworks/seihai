name: CI

# Pull request and main-branch checks on all three platforms.
# Releases stay in release.yml (tags and manual runs only).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Every platform builds and tests without audio (each client's
      # `audio` feature off, so seihai-core's is too): rodio/cpal and the
      # platform sound libraries are not compiled, which keeps the jobs
      # short, and Linux needs no ALSA development files or apt step. The
      # audio build is compiled by release.yml, which builds the defaults.
      FEATURES: --no-default-features --features seihai-mae/dev,seihai-core/dev
    defaults:
      run:
        shell: bash
    steps:
      # Keep text fixtures (levels, ganis, scripts) byte-for-byte on Windows.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build
        run: cargo build --workspace $FEATURES
      - name: Test
        run: cargo test --workspace --no-fail-fast $FEATURES
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets $FEATURES -- -D warnings
