name: CI

# Pull request and main-branch checks on Linux and Windows.
# Releases stay in release.yml (tags and manual runs only).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS has its own workflow, macos.yml (README.md, "macOS builds").
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Every platform builds, tests and lints the default features, with
      # audio, as release.yml builds them, so audio-only breakage shows on
      # the PR.
      FEATURES: ''
    defaults:
      run:
        shell: bash
    steps:
      # Keep text fixtures (levels, ganis, scripts) byte-for-byte on Windows.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: ALSA development files (Linux audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build
        run: cargo build --workspace $FEATURES
      - name: Test
        run: cargo test --workspace --no-fail-fast $FEATURES
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets $FEATURES -- -D warnings
      # The start window joins a loopback stand-in with one version of each
      # line, runs the client in this process and comes back (#469).
      - name: One program, each line, back to the start window
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: |
          xvfb-run -a -s "-screen 0 1280x1024x24" tools/launcher-smoke.sh \
            "$PWD/target/debug/seihai" "$RUNNER_TEMP/smoke" 2.22 3.04 5.12 6.03r7 graal3d
