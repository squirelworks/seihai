name: CI

# Pull request and main-branch checks on Linux and Windows.
# Releases stay in release.yml (tags and manual runs only).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is not built on GitHub runners: it is built and tested on the
        # Sequoia VM in the lab (see README.md, "macOS builds").
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Every platform builds, tests and lints the default features, with
      # audio, as release.yml builds them, so audio-only breakage shows on
      # the PR.
      FEATURES: ''
    defaults:
      run:
        shell: bash
    steps:
      # Keep text fixtures (levels, ganis, scripts) byte-for-byte on Windows.
      - name: No line-ending conversion
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: ALSA development files (Linux audio)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Build
        run: cargo build --workspace $FEATURES
      - name: Test
        run: cargo test --workspace --no-fail-fast $FEATURES
      - name: Format
        if: ${{ !cancelled() }}
        run: cargo fmt --all -- --check
      - name: Clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets $FEATURES -- -D warnings
