name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to draft, without the v (e.g. 0.1.0). Leave empty to build only.'
        required: false
        default: ''
      skip_macos:
        description: 'Leave out the two macOS builds (when GitHub has no macOS runners). Run again without it later to add them to the same draft.'
        type: boolean
        required: false
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      # skip_macos (manual runs only) leaves out the macOS rows; a tag push builds all four.
      matrix:
        include: ${{ fromJSON(inputs.skip_macos && '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","name":"seihai-linux-x86_64"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","name":"seihai-windows-x86_64"}]' || '[{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","name":"seihai-linux-x86_64"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc","name":"seihai-windows-x86_64"},{"os":"macos-latest","target":"x86_64-apple-darwin","name":"seihai-macos-x86_64"},{"os":"macos-latest","target":"aarch64-apple-darwin","name":"seihai-macos-aarch64"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux audio headers
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p seihai -p seihai-mae -p seihai-ato -p seihai-g3d --target ${{ matrix.target }}
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz seihai seihai-mae seihai-ato seihai-g3d
      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path seihai.exe,seihai-mae.exe,seihai-ato.exe,seihai-g3d.exe -DestinationPath ../../../${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  # Drafts only. The tag is made when Squirrel presses Publish on the draft, so
  # nothing is tagged or released without the owner's go-ahead. See RELEASES.md
  # in squirelworks/seihai.
  draft:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          TITLE: Seihai
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v$INPUT_VERSION"; else TAG="$GITHUB_REF_NAME"; fi
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "::error::bad version $TAG"; exit 1; }
          CARGO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$CARGO" = "$TAG" ] || echo "::warning::Cargo.toml says $CARGO, the release is $TAG"
          # Release notes are written by hand, reviewed in a PR, and kept here.
          NOTES="docs/releases/$TAG.md"
          [ -f "$NOTES" ] || { echo "::error::No release notes: write $NOTES in a PR first"; exit 1; }
          ls -l dist
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft -q .isDraft)" = true ]; then
              gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*
              gh release edit "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --notes-file "$NOTES"
            else
              echo "$TAG is already published; leaving it as it is."
            fi
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "$TITLE ${TAG#v}" --notes-file "$NOTES" dist/*
          fi
          echo "Draft: $(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
