[package]
name = "seihai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = "1"
bzip2 = "0.5"
minifb = "0.27"
eframe = "0.29"
egui = "0.29"
# Sound device output. Optional: the client runs without it, with sound
# silent. Needs the ALSA development files on Linux.
rodio = { version = "0.19", optional = true, default-features = false }

[[bin]]
name = "seihai"
path = "src/bin/main.rs"

[features]
# Developer mode (F9 wallhack). On for now; build with
# `--no-default-features` to compile it out.
default = ["dev"]
dev = []
# Real audio output through rodio/cpal. Off by default; without it the
# sound engine uses the null backend.
audio-rodio = ["dep:rodio"]

[dev-dependencies]
serde_json = "1"
