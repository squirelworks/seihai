[package]
name = "seihai"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
flate2 = "1"
bzip2 = "0.5"
minifb = "0.27"
eframe = "0.29"
egui = "0.29"

[[bin]]
name = "seihai"
path = "src/bin/main.rs"

[features]
# Developer mode (F9 wallhack). On for now; build with
# `--no-default-features` to compile it out.
default = ["dev"]
dev = []

[dev-dependencies]
serde_json = "1"
