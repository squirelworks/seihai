[workspace]
members = ["crates/seihai-mae", "crates/seihai-ato", "crates/seihai-play", "crates/seihai-issho", "crates/seihai-g3d", "crates/seihai-launcher", "tools/level-editor"]
resolver = "2"

[workspace.package]
version = "0.0.7"
edition = "2021"
license = "MIT OR Apache-2.0"

# seihai-core lives in its own repo (squirelworks/seihai-core). Every crate
# here takes it from this one pin, so the whole workspace builds against the
# same core. To work on core and a client together, clone seihai-core next to
# this repo and add a `[patch."https://github.com/squirelworks/seihai-core"]`
# entry pointing at it in your local .cargo/config.toml.
[workspace.dependencies]
seihai-core = { git = "https://github.com/squirelworks/seihai-core", rev = "3cbf841568ebc67bd94f2ba056bf70461c645b72", default-features = false }
# The drawing shared with tools: tiles, sprites and gani frames into an
# RGBA buffer. From the same seihai-core pin. (Pinned to the commit of
# seihai-core #42 until v0.0.27 is published; then back to `tag = "v0.0.27"`.)
seihai-draw = { git = "https://github.com/squirelworks/seihai-core", rev = "3cbf841568ebc67bd94f2ba056bf70461c645b72" }

# Release builds ship one program (`seihai`), so it is built small: no
# debug symbols, and link-time optimisation across all the crates.
[profile.release]
strip = true
lto = true
codegen-units = 1
