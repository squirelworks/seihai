[workspace]
members = ["crates/seihai-mae", "crates/seihai-ato", "crates/seihai-play", "crates/seihai-issho", "crates/seihai-g3d", "crates/seihai-launcher", "tools/level-editor"]
resolver = "2"
# vendor/minifb is a patched copy of a dependency, not a member.
exclude = ["vendor/minifb"]

[workspace.package]
version = "0.0.7"
edition = "2021"
license = "MIT OR Apache-2.0"

# seihai-core lives in its own repo (squirelworks/seihai-core). Every crate
# here takes it from this one pin, so the whole workspace builds against the
# same core. To work on core and a client together, clone seihai-core next to
# this repo and add a `[patch."https://github.com/squirelworks/seihai-core"]`
# entry pointing at it in your local .cargo/config.toml.
[workspace.dependencies]
# Pin includes GR-V1.05 binary level read/write (seihai-core #98) and GS2
# object variables + list host properties (seihai-core #103; repoint to its
# merge commit once merged). No release
# tag yet; bump to a tag when Squirrel cuts one.
seihai-core = { git = "https://github.com/squirelworks/seihai-core", rev = "af0b1acb9c5031c0c778c03b91e19287c9cd328a", default-features = false }
# The drawing shared with tools: tiles, sprites and gani frames into an
# RGBA buffer. From the same seihai-core rev.
seihai-draw = { git = "https://github.com/squirelworks/seihai-core", rev = "af0b1acb9c5031c0c778c03b91e19287c9cd328a" }

# minifb 0.27.0 with one change: on macOS, when there is no Metal device
# (a VM's emulated display) or MINIFB_NO_METAL is set, the window draws with
# CoreGraphics instead of failing to open. See vendor/minifb/SEIHAI-CHANGES.md.
[patch.crates-io]
minifb = { path = "vendor/minifb" }

# Release builds ship one program (`seihai`), so it is built small: no
# debug symbols, and link-time optimisation across all the crates.
[profile.release]
strip = true
lto = true
codegen-units = 1
