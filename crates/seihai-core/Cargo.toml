[package]
name = "seihai-core"
version.workspace = true
edition.workspace = true
license.workspace = true

# The shared library: protocol, assets, scripting, the offline simulation,
# the version profiles and the connection code. Nothing here draws or opens
# a window; that is the client binaries' job. The sound device output is
# here, behind the `audio` feature, so every client gets the same one.
[lib]
name = "seihai_core"
path = "src/lib.rs"

[dependencies]
flate2 = "1"
bzip2 = "0.5"
# The Seihai secure login (`protocol::seclogin`, token SEI00001): X25519,
# Ed25519, HKDF-SHA256 and ChaCha20-Poly1305, all RustCrypto/dalek crates
# under MIT OR Apache-2.0 (or BSD-3-Clause for the dalek ones).
x25519-dalek = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
# Sound device output (`sound::RodioSound`, feature `audio`). Needs the
# ALSA development files on Linux.
rodio = { version = "0.19", optional = true, default-features = false }

[features]
# Developer mode (F9 wallhack). The mae binary turns it on through its own
# `dev` feature.
default = ["dev", "audio"]
dev = []
# Real sound output through rodio/cpal. Every client forwards its own
# `audio` feature (on by default) to this one; a build with
# `--no-default-features` on the client leaves it out, and that client's
# sound is silent.
audio = ["dep:rodio"]

[dev-dependencies]
serde_json = "1"
