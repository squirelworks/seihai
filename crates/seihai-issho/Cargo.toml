[package]
name = "seihai-issho"
version.workspace = true
edition.workspace = true
license.workspace = true

# The v6 client profile (quattro_lib). The `seihai` launcher starts this
# binary when `--version` is a 6.x row. No `--version` stays on seihai-mae.
# This crate does not depend on seihai-ato and has no Torque code.
[lib]
name = "seihai_issho"
path = "src/lib.rs"

[[bin]]
name = "seihai-issho"
path = "src/main.rs"

[dependencies]
seihai-core.workspace = true
# The game loop (shared with seihai-ato) and the window, for `window`.
seihai-play = { path = "../seihai-play", optional = true }
eframe = { version = "0.29", optional = true }
egui = { version = "0.29", optional = true }

[features]
default = ["audio", "window"]
# Sound through seihai-core's device output. On by default; on Linux it
# needs the ALSA development files. `--no-default-features` leaves it out.
audio = ["seihai-core/audio", "seihai-play?/audio"]
# The game window (`--online` without `--no-window`, and `--level`). The
# launcher links this crate only for its version checks, without it.
window = ["dep:seihai-play", "dep:eframe", "dep:egui"]
