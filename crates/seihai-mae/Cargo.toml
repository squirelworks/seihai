[package]
name = "seihai-mae"
version.workspace = true
edition.workspace = true
license.workspace = true

# The library keeps the name `seihai` so `seihai::...` paths in the
# binary, the examples and the tests do not change.
[lib]
name = "seihai"
path = "src/lib.rs"

[dependencies]
seihai-core.workspace = true
# Chat text over heads (TrueType). Already in the tree through egui.
ab_glyph = "0.2"
minifb = "0.27"
eframe = "0.29"
egui = "0.29"

# `seihai-mae`: the 1.x and 2.x client. The `seihai` command is
# `seihai-launcher`, which starts this binary (or `seihai-ato` for a 3.x
# build); this one also runs on its own.
[[bin]]
name = "seihai-mae"
path = "src/bin/main.rs"

[features]
# Developer mode (F9 wallhack). On for now; build with
# `--no-default-features` to compile it out.
default = ["dev", "audio"]
dev = ["seihai-core/dev"]
# Sound through seihai-core's device output (rodio/cpal). On by default.
# On Linux this needs the ALSA development files (libasound2-dev). Build
# with `--no-default-features --features dev` to leave it out.
audio = ["seihai-core/audio"]

[dev-dependencies]
serde_json = "1"

# Linux/BSD under X11: frames go to the window through MIT-SHM shared
# memory instead of minifb's XPutImage over the socket (see
# `seihai::present`). Wayland and the other systems keep minifb's path.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
raw-window-handle = "0.6"
