[package]
name = "seihai-ato"
version.workspace = true
edition.workspace = true
license.workspace = true

# The Torque / 3.x client line. Stage 1: the 3.x wire facts (token, the
# 3.x-only ids, the Torque profile) and the start window. Stage 2: log in,
# keep the level and log it. Stage 3: draw it flat and walk it.
[lib]
name = "seihai_ato"
path = "src/lib.rs"

[[bin]]
name = "seihai-ato"
path = "src/main.rs"

[dependencies]
seihai-core.workspace = true
# The start window. Same versions as seihai-mae.
eframe = "0.29"
egui = "0.29"

[features]
default = ["audio"]
# Sound through seihai-core's device output. On by default; on Linux it
# needs the ALSA development files. `--no-default-features` leaves it out.
audio = ["seihai-core/audio"]
# v6 and later: leave the Torque reimplementation out of the binary.
# The default build does not enable this, so `torque::engine` is compiled.
# The product default follows the selected era and is on for v3, v4 and v5.
# Do not add `era6` to the default features. `--all-features` selects it
# and therefore omits the engine.
era6 = []
