[package]
name = "seihai-ato"
version.workspace = true
edition.workspace = true
license.workspace = true

# The Torque / 3.x client line. Stage 1: the 3.x wire facts (token, the
# 3.x-only ids, the Torque profile) and the start window. Stage 2: log in,
# keep the level and log it. Stage 3: draw it flat and walk it.
[lib]
name = "seihai_ato"
path = "src/lib.rs"

[[bin]]
name = "seihai-ato"
path = "src/main.rs"

[dependencies]
seihai-core = { path = "../seihai-core", default-features = false }
# The start window. Same versions as seihai-mae.
eframe = "0.29"
egui = "0.29"
